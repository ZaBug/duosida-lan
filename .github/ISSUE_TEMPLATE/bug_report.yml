name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The model and firmware are shown on the device page
        in Home Assistant (Settings → Devices & services → Duosida LAN → device).
  - type: input
    id: model
    attributes:
      label: Wallbox model
      placeholder: DUOSIDA Mode3@32A, single phase
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Wallbox firmware
      placeholder: V2.5
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.3.1
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.10.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: other_clients
    attributes:
      label: Other local clients
      description: The wallbox accepts very few local sessions (see "Connection limits" in the README).
      options:
        - Only this integration talks to the wallbox
        - The Duosida app or another tool was open at the same time
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Enable debug logging (device page → ⋮ → Enable debug logging, or add
        `custom_components.duosida_lan: debug` under `logger:` in
        `configuration.yaml`), reproduce the problem, then paste the relevant lines.
        Remove anything you consider private before posting.
      render: text
